{{- $secretName := default .Values.infraSecretsName .Values.argocd.secretsName -}}
{{- if and .Values.argocd.enabled $secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        admin.password: '{{ "{{ .admin_password | bcrypt }}" }}'
        admin.passwordMtime: {{ .Values.argocd.passwordMtime | default "2026-01-01T00:00:00Z" | quote }}
  data:
    - secretKey: admin_password
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.argocd.passwordProperty | default "ARGOCD_ADMIN_PASSWORD" | quote }}
{{- end }}
