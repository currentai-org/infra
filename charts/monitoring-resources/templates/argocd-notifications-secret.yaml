{{- $secretName := default .Values.infraSecretsName .Values.argocdNotifications.secretsName -}}
{{- if and .Values.argocdNotifications.enabled $secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: slack-token
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.argocdNotifications.slackTokenProperty | default "ARGOCD_NOTIFICATIONS_SLACK_TOKEN" | quote }}
    - secretKey: email-username
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.argocdNotifications.emailUsernameProperty | default "ARGOCD_NOTIFICATIONS_EMAIL_USERNAME" | quote }}
    - secretKey: email-password
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.argocdNotifications.emailPasswordProperty | default "ARGOCD_NOTIFICATIONS_EMAIL_PASSWORD" | quote }}
{{- end }}
