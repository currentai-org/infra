{{- $secretName := default .Values.infraSecretsName .Values.prometheus.secretsName -}}
{{- if $secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-web-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: prometheus-web-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        web.config: |
          basic_auth_users:
            {{ "{{ .admin_user }}" }}: {{ "{{ .admin_password | bcrypt }}" }}
        admin-user: '{{ "{{ .admin_user }}" }}'
        admin-password: '{{ "{{ .admin_password }}" }}'
  data:
    - secretKey: admin_user
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.prometheus.userProperty | default "PROMETHEUS_ADMIN_USER" | quote }}
    - secretKey: admin_password
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.prometheus.passwordProperty | default "PROMETHEUS_ADMIN_PASSWORD" | quote }}
{{- end }}
