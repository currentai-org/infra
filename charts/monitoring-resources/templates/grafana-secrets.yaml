{{- $secretName := default .Values.infraSecretsName .Values.grafana.secretsName -}}
{{- if $secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.grafana.userProperty | default "GRAFANA_ADMIN_USER" | quote }}
    - secretKey: admin-password
      remoteRef:
        key: {{ $secretName | quote }}
        property: {{ .Values.grafana.passwordProperty | default "GRAFANA_ADMIN_PASSWORD" | quote }}
{{- end }}
