# currentai addition (LOCAL-PATCHES.md). Slices DB credentials from AWS Secrets Manager
# and generates the PostgreSQL connection string expected by Pangolin when database.mode=external.
{{ if .Values.currentai.databaseExternalSecret.enabled }}
{{- $es := .Values.currentai.databaseExternalSecret -}}
{{- $secretName := include "pangolin.database.connectionSecretName" . -}}
{{- $secretKey := include "pangolin.db.connectionSecretKey" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "pangolin.namespace" . }}
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name | default "aws-secretsmanager" }}
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $secretName }}
    creationPolicy: {{ dig "target" "creationPolicy" "Owner" $es }}
    deletionPolicy: {{ dig "target" "deletionPolicy" "Retain" $es }}
    template:
      engineVersion: v2
      data:
        {{ $secretKey }}: 'postgresql://{{ "{{ .DB_USER | urlquery }}" }}:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:{{ $es.port | default 5432 }}/{{ $es.databaseName | default "pangolin" }}?sslmode={{ $es.sslMode | default "no-verify" }}{{ if $es.extraParams }}&{{ $es.extraParams }}{{ end }}'
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ required "currentai.databaseExternalSecret.dbPasswordArn is required" $es.dbPasswordArn | quote }}
        property: {{ $es.dbPasswordProperty | default "password" | quote }}
    - secretKey: DB_HOST
      remoteRef:
        key: {{ required "currentai.databaseExternalSecret.managedSecretsName is required" $es.managedSecretsName | quote }}
        property: {{ $es.dbHostProperty | default "DB_HOST" | quote }}
    - secretKey: DB_USER
      remoteRef:
        key: {{ $es.managedSecretsName | quote }}
        property: {{ $es.dbUserProperty | default "DB_USER" | quote }}
{{- end }}
