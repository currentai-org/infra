# currentai addition (LOCAL-PATCHES.md, B2). Upstream's own generated Secret (secrets.yaml) is
# unusable under ArgoCD: it's rendered via `helm template`, where the chart's own `lookup`-based
# stability check (_helpers.tpl's pangolin.app.secretValue) always takes the "generate a new random
# value" branch, since `lookup` only works against a live cluster connection that `helm template`
# never has. Setting pangolin.secret.existingSecretName (done in our values overlay) skips
# secrets.yaml's generated Secret entirely -- this ExternalSecret supplies that named Secret instead,
# sourced from AWS Secrets Manager via the same aws-secretsmanager ClusterSecretStore and
# dataFrom.extract pattern charts/agent-service/templates/externalsecret.yaml already uses. The
# result is identical on every render and every restart: see LOCAL-PATCHES.md's verification section
# for the render-twice-diff regression test.
{{- if .Values.currentai.serverSecretExternalSecret.enabled }}
{{- if not .Values.pangolin.secret.existingSecretName }}
{{- fail "currentai: currentai.serverSecretExternalSecret.enabled=true requires pangolin.secret.existingSecretName to be set to the same Secret name this ExternalSecret creates." }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.pangolin.secret.existingSecretName }}
  namespace: {{ include "pangolin.namespace" . }}
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.currentai.serverSecretExternalSecret.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.currentai.serverSecretExternalSecret.secretStoreRef.name | default "aws-secretsmanager" }}
    kind: {{ .Values.currentai.serverSecretExternalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.pangolin.secret.existingSecretName }}
    creationPolicy: {{ dig "target" "creationPolicy" "Owner" .Values.currentai.serverSecretExternalSecret }}
    deletionPolicy: {{ dig "target" "deletionPolicy" "Retain" .Values.currentai.serverSecretExternalSecret }}
  dataFrom:
    - extract:
        key: {{ .Values.currentai.serverSecretExternalSecret.remoteKey | default "/pangolin" | quote }}
{{- end }}
