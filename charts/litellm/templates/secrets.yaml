apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.global.namespace | default "router" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database_url: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/litellm?sslmode=require'
        redis_url: '{{ "{{ .REDIS_URL }}" }}'
        redis_host: '{{ "{{ .REDIS_HOST }}" }}'
        litellm_master_key: '{{ "{{ .LITELLM_MASTER_KEY }}" }}'
        litellm_salt_key: '{{ "{{ .LITELLM_SALT_KEY }}" }}'
        sealion_api_key: '{{ "{{ .SEALION_API_KEY }}" }}'
        featherless_api_key: '{{ "{{ .FEATHERLESS_API_KEY }}" }}'
        nexbit_api_key: '{{ "{{ .NEXBIT_API_KEY }}" }}'
        hf_token: '{{ "{{ .HF_TOKEN }}" }}'
        openrouter_api_key: '{{ "{{ .OPENROUTER_API_KEY }}" }}'
        slack_webhook_url: '{{ "{{ .SLACK_WEBHOOK_URL }}" }}'
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.dbPasswordArn }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: DB_HOST
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: REDIS_URL
    - secretKey: REDIS_HOST
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: REDIS_HOST
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: LITELLM_MASTER_KEY
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: LITELLM_SALT_KEY
    - secretKey: SEALION_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: SEALION_API_KEY
    - secretKey: FEATHERLESS_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: FEATHERLESS_API_KEY
    - secretKey: NEXBIT_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: NEXBIT_API_KEY
    - secretKey: HF_TOKEN
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: HF_TOKEN
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: OPENROUTER_API_KEY
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: SLACK_WEBHOOK_URL



