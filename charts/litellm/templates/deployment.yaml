apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Values.global.namespace | default "router" }}
spec:
  replicas: {{ .Values.app.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 300
  minReadySeconds: {{ .Values.app.minReadySeconds | default 20 }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
      {{- if .Values.prometheus.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: {{ .Values.app.name }}
          image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          args:
            - "--config"
            - "/app/config.yaml"
          env:
            - name: AWS_REGION
              value: {{ .Values.env.aws_region | quote }}
            - name: LITELLM_MODE
              value: "PRODUCTION"
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: litellm_salt_key
            - name: USE_PRISMA_MIGRATE
              value: "True"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: litellm_master_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: redis_url
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: redis_host
            - name: REDIS_PORT
              value: "{{ .Values.env.litellmRedisPort }}"
            - name: LITELLM_REDIS_PORT
              value: "{{ .Values.env.litellmRedisPort }}"
            - name: SEALION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: sealion_api_key
                  optional: true
            - name: FEATHERLESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: featherless_api_key
                  optional: true
            - name: NEXBIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: nexbit_api_key
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: hf_token
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: openrouter_api_key
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: slack_webhook_url
                  optional: true



          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true

          ports:
            - containerPort: {{ .Values.app.port }}
          {{- if .Values.app.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.livenessProbe.path | default "/health/liveliness" }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.app.livenessProbe.periodSeconds | default 15 }}
            timeoutSeconds: {{ .Values.app.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.app.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if .Values.app.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.readinessProbe.path | default "/health/readiness" }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.app.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.app.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.app.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ .Values.app.name }}-config