pass_through_endpoints:
  - path: "/v1/cloudflare/clef"
    target: "https://api.cloudflare.com/client/v4/accounts/os.environ/CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/cloudflare/clef"
    headers:
      Authorization: "Bearer os.environ/CLOUDFLARE_API_KEY"
      Content-Type: "application/json"
    forward_headers: true
