# Plane B — the per-task execution service. Credential-free (no real model token; it gets a per-task
# nonce from the proxy). Durable task store on a PVC so results + the per-user spend ledger survive
# restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-service.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-app
    plane: b
spec:
  # replicas MUST stay 1 — see values.yaml's own comment; the SQLite task store and the in-memory
  # concurrency cap below are both per-pod state.
  replicas: {{ .Values.app.replicas }}
  minReadySeconds: {{ .Values.app.minReadySeconds | default 30 }}
  progressDeadlineSeconds: {{ .Values.app.progressDeadlineSeconds | default 300 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
        plane: b
    spec:
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds | default 30 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Image's own CMD hardcodes --port 8731 with no PORT env var read (deploy/Dockerfile:99) — an
          # app.port override with no matching command here would move every K8s-side reference
          # (containerPort, both probes, the Service, the NetworkPolicy) while the process itself kept
          # listening on 8731. Pass it explicitly, matching proxy-deployment.yaml's own pattern, so the
          # value is actually wired end to end rather than just plausible-looking.
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", {{ .Values.app.port | quote }}]
          ports:
            - containerPort: {{ .Values.app.port }}
          {{- if and .Values.app.preStop .Values.app.preStop.enabled }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "{{ .Values.app.preStop.sleepSeconds | default 5 }}"]
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.app.secretName }}
          env:
            # Talk to Plane A by its in-chart Service name — never upstream directly.
            - name: AGENT_MODEL_PROXY_URL
              value: "http://{{ .Release.Name }}-proxy:{{ .Values.proxy.port }}"
            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # bwrap needs user-namespace cloning; it drops privileges itself. No NET_ADMIN — egress is the
          # NetworkPolicy's job, not the container's (see templates/networkpolicy.yaml — confirm the
          # cluster's CNI actually enforces NetworkPolicy before relying on it as the exfil control).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          {{- if and .Values.app.startupProbe .Values.app.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.app.startupProbe.path | default "/healthz" }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.startupProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.app.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.app.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.app.startupProbe.failureThreshold | default 30 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.readinessProbe.path | default "/healthz" }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.app.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.app.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.app.readinessProbe.failureThreshold | default 3 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.livenessProbe.path | default "/healthz" }}
              port: {{ .Values.app.port }}
            initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.app.livenessProbe.periodSeconds | default 15 }}
            timeoutSeconds: {{ .Values.app.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.app.livenessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-app-data
