{{- range .Values.ingresses }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  {{- if .namespace }}
  namespace: {{ .namespace }}
  {{- end }}
  annotations:
{{- range $key, $value := .annotations }}
  {{- if eq $key "alb.ingress.kubernetes.io/certificate-arn" }}
    {{- $resolvedCert := tpl $value $ }}
    {{- if $resolvedCert }}
    {{ $key }}: {{ $resolvedCert | quote }}
    {{- end }}
  {{- else }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
spec:
  ingressClassName: {{ .ingressClassName | default "alb" }}
  rules:
  {{- if .host }}
  {{- /* Quoted: an unquoted leading "*" (a wildcard host, e.g. "*.tunnel.example.com") is YAML's
    alias indicator, not a literal character -- an unquoted wildcard host breaks parsing. */}}
  - host: {{ tpl .host $ | quote }}
    http:
  {{- else }}
  - http:
  {{- end }}
      paths:
      {{- if .paths }}
      {{- /* Multi-path entry: for routing a single host to more than one backend by path (e.g. a
        dashboard whose UI and API live on different ports). Longest-prefix wins per the Ingress
        spec, so listed order doesn't affect matching -- list the more specific path first anyway,
        for readability. */}}
      {{- range .paths }}
      - path: {{ .path | default "/" }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
            name: {{ .targetService.name }}
            port:
              number: {{ .targetService.port }}
      {{- end }}
      {{- else }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .targetService.name }}
            port:
              number: {{ .targetService.port }}
      {{- end }}
{{- end }}
{{- end }}