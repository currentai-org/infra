{{- range .Values.ingressClasses }}
{{- if .params }}
---
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: {{ .name | quote }}
spec:
  {{- toYaml .params | nindent 2 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .name | quote }}
  {{- if .isDefault }}
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  {{- end }}
spec:
  controller: {{ .controller | default "eks.amazonaws.com/alb" | quote }}
  {{- if .params }}
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: {{ .name | quote }}
  {{- end }}
{{- end }}
