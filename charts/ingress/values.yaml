# Ingress configuration for web services
# Note: These example ingresses are overwritten by the environment-specific values in:
#   - Staging:    argo/environments/staging/ingress-values.yaml
#   - Production: argo/environments/production/ingress-values.yaml

domain: currentai.org
certificateArn: ""

# EKS Auto Mode (eks.amazonaws.com/alb) creates one shared ALB per IngressClassParams group.
# ALB-wide settings (scheme, targetType, group.name, loadBalancerAttributes) live here rather
# than as per-Ingress annotations — pick `alb-public` or `alb-admin` via `ingressClassName`.
ingressClasses:
  - name: alb-public
    controller: eks.amazonaws.com/alb
    isDefault: true
    params:
      scheme: internet-facing
      targetType: ip
      group:
        name: public
  - name: alb-admin
    controller: eks.amazonaws.com/alb
    isDefault: false
    params:
      scheme: internet-facing
      targetType: ip
      group:
        name: admin
      loadBalancerAttributes:
        - key: idle_timeout.timeout_seconds
          value: "3600"

ingresses:
  - enabled: true
    name: example-user-application-ingress
    namespace: example-namespace
    ingressClassName: alb-public
    host: user-app.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
    targetService:
      name: user-application-service
      port: 8080

  - enabled: true
    name: example-admin-application-ingress
    namespace: example-namespace
    ingressClassName: alb-admin
    host: admin-app.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
    targetService:
      name: admin-application-service
      port: 80
