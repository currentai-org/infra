apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    notifications.argoproj.io/subscribe.on-health-degraded.slack: "#cai-infra-alerts"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: "#cai-infra-alerts"
    notifications.argoproj.io/subscribe.on-health-degraded.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-sync-failed.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-deployed.slack: "#cai-infra-alerts"
    notifications.argoproj.io/subscribe.on-deployed.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-created.slack: "#cai-infra-alerts"
    notifications.argoproj.io/subscribe.on-created.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-deleted.slack: "#cai-infra-alerts"
    notifications.argoproj.io/subscribe.on-deleted.email: "sean+infra@currentai.org"
spec:
  project: default
  source:
    repoURL: 'https://github.com/currentai-org/infra'
    targetRevision: main
    path: charts/cluster-agent
    helm:
      valueFiles:
        - values.yaml
        - ../../argo/environments/production/cluster-agent-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cluster-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
