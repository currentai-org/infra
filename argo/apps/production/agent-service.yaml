apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/currentai-org/infra'
    targetRevision: dev
    path: charts/agent-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
