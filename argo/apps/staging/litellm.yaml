apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/currentai-org/infra'
    targetRevision: dev
    path: charts/litellm
    helm:
      valueFiles:
        - values.yaml
        - ../../argo/environments/staging/litellm-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: currentai-router
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
