apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/currentai-org/infra'
    targetRevision: dev
    path: charts/ingress
    helm:
      valueFiles:
        - values.yaml
        - ../../argo/environments/staging/ingress-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: experiment-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
