apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: currentai-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    notifications.argoproj.io/subscribe.on-health-degraded.slack: "#cai-stg-infra-alerts"
    notifications.argoproj.io/subscribe.on-sync-failed.slack: "#cai-stg-infra-alerts"
    notifications.argoproj.io/subscribe.on-health-degraded.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-sync-failed.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-deployed.slack: "#cai-stg-infra-alerts"
    notifications.argoproj.io/subscribe.on-deployed.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-created.slack: "#cai-stg-infra-alerts"
    notifications.argoproj.io/subscribe.on-created.email: "sean+infra@currentai.org"
    notifications.argoproj.io/subscribe.on-deleted.slack: "#cai-stg-infra-alerts"
    notifications.argoproj.io/subscribe.on-deleted.email: "sean+infra@currentai.org"
spec:
  project: default
  source:
    repoURL: 'https://github.com/currentai-org/infra'
    targetRevision: stg
    path: charts/ingress
    helm:
      valueFiles:
        - values.yaml
        - ../../argo/environments/staging/ingress-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: experiment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
