apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.openwebui.com/'
    chart: open-webui
    targetRevision: 15.2.1
  destination:
    server: https://kubernetes.default.svc
    namespace: experiment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
