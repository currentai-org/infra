domain: aipotluck.org

# Please stick to the following ingress group names: currentai-public, currentai-api, currentai-admin
# Please do not add other ingress groups names, they will create new load balancers.

ingresses:
  - enabled: false
    name: grafana-ingress
    namespace: monitoring
    ingressClassName: alb
    host: grafana.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
      alb.ingress.kubernetes.io/group.name: currentai-admin
    targetService:
      name: grafana
      port: 80

  - enabled: false
    name: prometheus-ingress
    namespace: monitoring
    ingressClassName: alb
    host: prometheus.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
      alb.ingress.kubernetes.io/group.name: currentai-admin
    targetService:
      name: prometheus-server
      port: 80

