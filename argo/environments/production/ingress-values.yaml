domain: currentai.cloud
# Set `certificateArn` to your eu-west-3 ACM certificate ARN before deploying HTTPS listeners.
certificateArn: ""

# EKS Auto Mode (eks.amazonaws.com/alb) maps each IngressClass to a shared ALB via IngressClassParams
# (defined in charts/ingress/values.yaml). Stick to `alb-public` or `alb-admin` for `ingressClassName`.

ingresses:
  - enabled: true
    name: argo-ingress
    namespace: argocd
    ingressClassName: alb-admin
    host: argo.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
    targetService:
      name: argocd-server
      port: 80

  - enabled: true
    name: grafana-ingress
    namespace: monitoring
    ingressClassName: alb-admin
    host: grafana.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
    targetService:
      name: grafana
      port: 80

  - enabled: true
    name: prometheus-ingress
    namespace: monitoring
    ingressClassName: alb-admin
    host: prometheus.{{ .Values.domain }}
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.certificateArn }}"
    targetService:
      name: prometheus-server
      port: 80
