# Production overrides for standalone Prometheus community chart
alertmanager:
  enabled: false

pushgateway:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

server:
  enableConfigReloader: false
  tcpSocketProbeEnabled: true
  retention: "40d"
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: "ebs-sc"
  extraFlags:
    - "web.config.file=/etc/prometheus/web.config"
    - "storage.tsdb.retention.size=45GB"
  extraVolumes:
    - name: web-config
      secret:
        secretName: prometheus-web-config
  extraVolumeMounts:
    - name: web-config
      mountPath: /etc/prometheus
      readOnly: true

configmapReload:
  prometheus:
    enabled: false
