name: Helm Lint and Verify

on:
  push:
    branches:
      - '**'

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Run Helm Lint
        run: |
          for dir in charts/*/; do
            if [ -d "$dir" ]; then
              echo "Linting chart in $dir"
              helm lint "$dir"
            fi
          done

  chart-verify:
    name: Verify Helm Charts
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Verify charts by running helm install --dry-run
        run: |
          # Dynamically extract and pre-create any namespaces referenced in values.yaml to avoid API errors
          # NOTE: charts/pangolin/values.yaml (CUR-1266, vendored + schema-annotated) has many more
          # `namespace:` lines than the other charts here, including several that aren't real
          # namespace names (empty defaults, schema comment lines). The extras just produce extra
          # `kubectl create namespace` calls on garbage tokens -- harmless, since every call is
          # `|| true`'d below, but worth this note so nobody spends time chasing it as a real failure.
          namespaces=$(grep -h "namespace:" charts/*/values.yaml 2>/dev/null | awk -F ':' '{print $2}' | tr -d ' ' | tr -d '"' | tr -d "'" | sort -u)
          for ns in $namespaces; do
            if [ -n "$ns" ]; then
              echo "Creating namespace: $ns"
              kubectl create namespace "$ns" || true
            fi
          done

          for dir in charts/*/; do
            if [ -d "$dir" ]; then
              chart_name=$(basename "$dir")
              if [ "$chart_name" = "pangolin" ]; then
                # Skipped here deliberately, not an oversight: charts/pangolin (CUR-1266) bundles the
                # CloudNativePG operator/cluster as subchart dependencies and its default values render
                # a Traefik controller mode + AWS-specific ESO/ALB config this Kind smoke-test cluster
                # has none of (no ClusterSecretStore, no default StorageClass matching production, no
                # Prometheus/Traefik CRDs). `helm lint` above still covers this chart; `helm unittest`
                # (run manually, not wired into this workflow yet) is its real regression coverage --
                # see charts/pangolin/LOCAL-PATCHES.md.
                echo "Skipping Kind dry-run install for $chart_name (see comment in this workflow)"
                continue
              fi
              echo "Verifying chart $chart_name"
              helm install "$chart_name" "$dir" --dry-run --create-namespace
            fi
          done


