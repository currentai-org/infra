name: Helm Lint and Verify

on:
  push:
    branches:
      - '**'

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Run Helm Lint
        run: |
          for dir in charts/*/; do
            if [ -d "$dir" ]; then
              echo "Linting chart in $dir"
              helm lint "$dir"
            fi
          done

  chart-verifier:
    name: Chart Verifier
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Run Chart Verifier - ingress
        uses: redhat-actions/chart-verifier@v1
        with:
          chart_uri: ./charts/ingress

      - name: Run Chart Verifier - simple-pod
        uses: redhat-actions/chart-verifier@v1
        with:
          chart_uri: ./charts/simple-pod
